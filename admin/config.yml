# {{GENERATED}}
#
# repo, branch, base_url and public_folder below are filled in by
# scripts/build.mjs from the `cms` and `base` fields in content/site.json.
# Edit them THERE, not here — this file is the template, and the deployed
# copy at /admin/config.yml is the generated one.
backend:
  name: github
  repo: "{{REPO}}"
  branch: "{{BRANCH}}"
  base_url: "{{AUTH_URL}}"


media_folder: "assets/photos"
# Must carry the site's base path, or images an editor uploads are written
# with a path that 404s once the base changes.
public_folder: "{{BASE}}/assets/photos"

# ---------------------------------------------------------------------------
# One collection: Pages. Everything shown on a page is edited in that page,
# including the 108 researchers (inside the Researchers block on Our people)
# and the 33 partner institutions (inside Partner institutions on Our
# partners). Each still gets its own address — /people/<slug>/ and
# /partners/<slug>/ — generated from those lists at build time.
#
# Was three collections, mirroring content/:
#
#   Pages     — the navigable pages. A page is a header (title, intro, hero)
#               plus content BLOCKS you can add and drag to reorder. Each
#               block type shows only its own fields.
#   People    — one file per researcher. These render at /people/<slug>/ and
#               populate the directory on the Our people page.
#   Partners  — one file per institution, rendering at /partners/<slug>/.
#
# `order` controls the left-hand menu; lower numbers sit higher. Setting a
# page's `parent` to another page's address nests it underneath in the menu.
# ---------------------------------------------------------------------------

collections:
  - name: "pages"
    label: "Pages"
    label_singular: "page"
    folder: "content/pages"
    extension: "json"
    format: "json"
    create: true
    identifier_field: "menuName"
    slug: "{{fields.slug}}"
    summary: "{{fields.order}} · {{fields.menuName}}"
    sortable_fields:
      - "order"
      - "menuName"
    fields:
      - { label: "Menu name", name: "menuName", widget: "string", hint: "Shown in the site's left-hand menu." }
      - { label: "Page address", name: "slug", widget: "string", pattern: ['^[a-z0-9-]+$', "Lower-case letters, numbers and hyphens only"], hint: "The web address, e.g. groundwater → /groundwater/. Changing it breaks existing links." }
      - { label: "Menu order", name: "order", widget: "number", value_type: "int", min: 1, default: 99, hint: "Lower numbers appear higher in the menu." }
      - { label: "Show on the site", name: "published", widget: "boolean", default: true, required: false }
      - { label: "Template", name: "template", widget: "hidden", default: "standard" }

      - label: "Title & introduction"
        name: "intro"
        widget: "object"
        collapsed: false
        fields: &introFields
          - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
          - { label: "Title", name: "title", widget: "text", hint: "Line break = where the title wraps to a new line." }
          - { label: "Introduction", name: "lede", widget: "text", hint: "One or two sentences. Also the page's Google description and its preview when shared." }
          - { label: "Eyebrow Text Size (%)", name: "eyebrowSize", widget: "number", default: 100, value_type: "int", min: 0, max: 200, step: 5, required: false }
          - { label: "Title Size (%)", name: "titleSize", widget: "number", default: 70, value_type: "int", min: 0, max: 200, step: 5, required: false }
          - { label: "Intro Text Size (%)", name: "ledeSize", widget: "number", default: 100, value_type: "int", min: 0, max: 200, step: 5, required: false }
          - { label: "Text Alignment", name: "textAlign", widget: "select", default: "left", required: false, options: ["left", "center", "right"] }
          - { label: "Text Position", name: "textPosition", widget: "select", default: "bottom", required: false, options: ["top", "middle", "bottom"] }
          - { label: "Text Block Width (%)", name: "textWidth", widget: "number", default: 100, value_type: "int", min: 30, max: 100, step: 5, required: false }
          - { label: "Text Offset X (%)", name: "textOffsetX", widget: "number", default: 0, value_type: "int", min: -30, max: 30, step: 1, required: false }
          - { label: "Text Offset Y (%)", name: "textOffsetY", widget: "number", default: 0, value_type: "int", min: -30, max: 30, step: 1, required: false }

      - label: "Header photo"
        name: "heroImage"
        widget: "object"
        collapsed: true
        required: false
        hint: "On the home page, leaving the photo empty shows the animated water artwork instead."
        fields: &photoFields
          - { label: "Photo", name: "image", widget: "image", required: false }
          - { label: "Description for screen readers", name: "alt", widget: "string", required: false }
          - { label: "Zoom (%)", name: "zoom", widget: "number", default: 100, value_type: "int", min: 50, max: 200, step: 5, required: false }
          - { label: "Focus X (%)", name: "positionX", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
          - { label: "Focus Y (%)", name: "positionY", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
          - { label: "Fit", name: "fit", widget: "select", default: "auto", required: false, options: ["auto", "cover", "contain"] }

      - label: "Menu photo"
        name: "menuImage"
        widget: "object"
        collapsed: true
        required: false
        hint: "Shown on the mobile menu card and when the page is shared. Falls back to the header photo."
        fields: *photoFields

      - label: "In-page navigation"
        name: "sectionNav"
        widget: "select"
        required: false
        options:
          - { label: "None", value: "none" }
          - { label: "Jump links — an on-this-page bar", value: "jump" }
          - { label: "Tabs — one section at a time", value: "tabs" }
          - { label: "Collapsible sections — open what you want", value: "collapse" }
        hint: "For long pages. A section starts at each Section banner or Story cards block that has a heading — or, if it has no heading, at its small label. Jump links keep the whole page visible; Tabs show one section at a time; Collapsible opens the page as a list of headings readers expand, several at once. Nothing is ever removed: without JavaScript every section shows in full."

      - label: "Name for the opening tab"
        name: "introTab"
        widget: "string"
        required: false
        default: "Overview"
        hint: "Tabs only. Whatever sits above the first section becomes its own tab with this name, so exactly one thing shows at a time. Type off to leave that content loose above the tabs instead."

      - label: "Start with every section closed"
        name: "startCollapsed"
        widget: "boolean"
        default: false
        required: false
        hint: "Collapsible only. Off means the first section is open so the page introduces itself; on means the page opens as a bare list of headings."

      - label: "Homepage hero (home page only)"
        name: "hero"
        widget: "object"
        collapsed: true
        required: false
        hint: "Only the home page uses this — the big opening screen's small texts and buttons."
        fields:
          - { label: "Corner label", name: "label", widget: "text", required: false }
          - { label: "Bottom-right caption", name: "caption", widget: "text", required: false }
          - { label: "Image area description (screen readers)", name: "stageAlt", widget: "string", required: false }
          - { label: "Photo description (screen readers)", name: "imageAlt", widget: "string", required: false }
          - label: "Buttons"
            name: "actions"
            widget: "list"
            required: false
            summary: "{{fields.label}}"
            fields: &actionFields
              - { label: "Label", name: "label", widget: "string" }
              # A typed page address that does not exist fails the build and stops the
              # whole site publishing, so this picks from the pages that exist rather
              # than trusting anyone to type one correctly.
              - label: "Goes to page"
                name: "page"
                widget: "relation"
                collection: "pages"
                value_field: "slug"
                display_fields: ["menuName"]
                search_fields: ["menuName", "slug"]
                hint: "Choose a page on this site."
              - { label: "Filled style", name: "primary", widget: "boolean", default: false, required: false }
          - { label: "i18n", name: "i18n", widget: "hidden", required: false }

      - label: "Content blocks"
        name: "blocks"
        widget: "list"
        label_singular: "block"
        required: false
        typeKey: "type"
        summary: "{{fields.type}}"
        hint: "The page's content, top to bottom. Add blocks and drag to rearrange."
        types:
          # ------------------------------------------------ generic blocks --
          - label: "Text"
            name: "text"
            widget: "object"
            fields:
              - { label: "Small label (optional)", name: "eyebrow", widget: "string", required: false }
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Text", name: "body", widget: "text", hint: "Use a blank line between paragraphs." }
              - { label: "Text alignment", name: "align", widget: "select", default: "left", required: false, options: ["left", "center", "right"] }
          - label: "Image + text"
            name: "imageText"
            widget: "object"
            fields:
              - { label: "Small label (optional)", name: "eyebrow", widget: "string", required: false }
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - { label: "Text", name: "body", widget: "text" }
              - { label: "Photo", name: "photo", widget: "object", collapsed: false, fields: *photoFields }
              - { label: "Photo side", name: "photoSide", widget: "select", default: "left", required: false, options: ["left", "right"] }
          - label: "Image gallery"
            name: "gallery"
            widget: "object"
            fields:
              - { label: "Heading (optional)", name: "heading", widget: "string", required: false }
              - { label: "Photos", name: "photos", widget: "list", fields: *photoFields }
          - label: "Callout / quote"
            name: "callout"
            widget: "object"
            fields:
              - { label: "Heading (optional)", name: "heading", widget: "string", required: false }
              - { label: "Callout text", name: "body", widget: "text" }
              - label: "Style"
                name: "tone"
                widget: "select"
                default: "blue"
                required: false
                options:
                  - { label: "Teal", value: "blue" }
                  - { label: "Copper", value: "copper" }
                hint: "The site uses two accent colours. Green was a third that rendered the same as teal, so it has been folded into it."
          - label: "Button link"
            name: "button"
            widget: "object"
            fields:
              - { label: "Heading (optional)", name: "heading", widget: "string", required: false }
              - { label: "Button label", name: "label", widget: "string" }
              - { label: "Link URL", name: "url", widget: "string" }
          - label: "Video"
            name: "video"
            widget: "object"
            fields:
              - { label: "Video URL", name: "url", widget: "string", pattern: ['^https?://\S+$', "Must be a full web address starting with https://"], hint: "A YouTube link; the thumbnail is picked up automatically." }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Small label", name: "meta", widget: "string", required: false }
          - label: "Embedded page"
            name: "embed"
            widget: "object"
            fields:
              - { label: "URL to embed", name: "url", widget: "string", pattern: ['^https?://\S+$', "Must be a full web address starting with https://"] }
              - { label: "Title", name: "title", widget: "string", required: false }

          # -------------------------------------------- editorial layouts --
          - label: "Two-column section"
            name: "split"
            widget: "object"
            fields:
              - label: "Left column"
                name: "left"
                widget: "object"
                collapsed: false
                fields: &splitColumn
                  - { label: "Column type", name: "kind", widget: "select", default: "prose", options: [{ label: "Text", value: "prose" }, { label: "Photo", value: "image" }, { label: "Photo with number overlay", value: "dataPanel" }] }
                  - { label: "Opening line (large)", name: "lead", widget: "text", required: false }
                  - { label: "Paragraphs", name: "paragraphs", widget: "list", required: false, field: { label: "Paragraph", name: "paragraph", widget: "text" } }
                  - label: "Numbered points"
                    name: "features"
                    widget: "list"
                    required: false
                    summary: "{{fields.title}}"
                    fields:
                      - { label: "Number", name: "number", widget: "string", required: false, hint: "Blank = automatic (01, 02…)" }
                      - { label: "Title", name: "title", widget: "string" }
                      - { label: "Text", name: "text", widget: "text", required: false }
                  - { label: "Buttons", name: "actions", widget: "list", required: false, summary: "{{fields.label}}", fields: *actionFields }
                  - { label: "Small logo above the text", name: "logo", widget: "object", collapsed: true, required: false, fields: [{ label: "Image", name: "image", widget: "image", required: false }, { label: "Description", name: "alt", widget: "string", required: false }] }
                  - { label: "Photo", name: "photo", widget: "object", collapsed: true, required: false, fields: *photoFields }
                  - { label: "Overlay number", name: "stat", widget: "string", required: false, hint: "Photo-with-number only." }
                  - { label: "Overlay caption", name: "caption", widget: "string", required: false, hint: "Photo-with-number only." }
                  - { label: "look", name: "look", widget: "hidden", required: false }
              - label: "Right column"
                name: "right"
                widget: "object"
                collapsed: false
                fields: *splitColumn
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Card grid"
            name: "cards"
            widget: "object"
            fields:
              - label: "Cards"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Corner label", name: "number", widget: "string", required: false, hint: "e.g. A / 01. Blank = automatic." }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text", required: false }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Photo pair"
            name: "imagePair"
            widget: "object"
            fields:
              - { label: "Style", name: "look", widget: "select", default: "editorial", required: false, options: [{ label: "Editorial (with captions)", value: "editorial" }, { label: "App screens", value: "screens" }] }
              - label: "Photos"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Photo", name: "photo", widget: "object", collapsed: false, fields: *photoFields }
                  - { label: "Caption", name: "caption", widget: "string", required: false }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Photo ribbon (3 across)"
            name: "photoRibbon"
            widget: "object"
            fields:
              - label: "Photos"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Photo", name: "photo", widget: "object", collapsed: false, fields: *photoFields }
          - label: "Dark banner"
            name: "banner"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string", required: false }
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Tab label", name: "tabLabel", widget: "string", required: false, hint: "Short name shown when the page uses tabs or jump links. Falls back to the acronym in the heading, then the heading itself." }
              - { label: "Text", name: "lede", widget: "text", required: false }
              - { label: "Label colour", name: "accent", widget: "string", required: false, hint: "Optional CSS colour, e.g. #88b3b8" }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Statement with numbers"
            name: "statement"
            widget: "object"
            fields:
              - { label: "Small label", name: "label", widget: "string", required: false }
              - { label: "Statement", name: "quote", widget: "text" }
              - label: "Numbers"
                name: "metrics"
                widget: "list"
                summary: "{{fields.value}} — {{fields.label}}"
                fields:
                  - { label: "Number", name: "value", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Story cards (with heading)"
            name: "storyCards"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string", required: false }
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Text", name: "lede", widget: "text", required: false }
              - label: "Cards"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  # A typed page address that does not exist fails the build and stops the
                  # whole site publishing, so this picks from the pages that exist rather
                  # than trusting anyone to type one correctly.
                  - label: "Goes to page"
                    name: "page"
                    widget: "relation"
                    collection: "pages"
                    value_field: "slug"
                    display_fields: ["menuName"]
                    search_fields: ["menuName", "slug"]
                    hint: "Choose a page on this site."
                  - { label: "Small label", name: "label", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Photo", name: "photo", widget: "object", collapsed: true, fields: *photoFields }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Numbered steps"
            name: "steps"
            widget: "object"
            fields:
              - label: "Steps"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text", required: false }
              - { label: "i18n", name: "i18n", widget: "hidden", required: false }
          - label: "Framed screenshot"
            name: "framedShot"
            widget: "object"
            fields:
              - { label: "Screenshot", name: "photo", widget: "object", collapsed: false, fields: *photoFields }

          # ------------------------------------------------- list layouts --
          - label: "Media stories (searchable)"
            name: "mediaStories"
            widget: "object"
            fields:
              - label: "Stories"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Source · date", name: "meta", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text", required: false }
                  - { label: "Link", name: "url", widget: "string" }
          - label: "Film grid"
            name: "filmGrid"
            widget: "object"
            fields:
              - label: "Films"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Small label", name: "meta", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "YouTube link", name: "url", widget: "string" }
          - label: "Photo archive (filters + lightbox)"
            name: "photoArchive"
            widget: "object"
            fields:
              - label: "Images"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Photo", name: "image", widget: "image" }
                  - { label: "Zoom (%)", name: "zoom", widget: "number", default: 100, value_type: "int", min: 50, max: 200, step: 5, required: false }
                  - { label: "Focus X (%)", name: "positionX", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
                  - { label: "Focus Y (%)", name: "positionY", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
                  - { label: "Fit", name: "fit", widget: "select", default: "auto", required: false, options: ["auto", "cover", "contain"] }
                  - { label: "Category", name: "category", widget: "string", hint: "Groups the image under a filter button." }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Source (optional)", name: "source", widget: "string", required: false }
          - label: "Publication section"
            name: "publicationList"
            widget: "object"
            fields:
              - { label: "Section heading", name: "heading", widget: "string", required: false, hint: "Shown above this group — e.g. Journal articles." }
              - label: "Type"
                name: "kind"
                widget: "select"
                options: ["Journal articles", "Conference papers", "Theses", "Books & chapters", "Reports & other"]
                default: "Journal articles"
                hint: "Groups this section under the filter buttons at the top of the page. Sections appear in the order you arrange them; a type with no section simply has no filter button yet."
              - label: "Publications"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Small label", name: "meta", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text", required: false }
                  - label: "Editions"
                    name: "editions"
                    widget: "list"
                    summary: "{{fields.label}}"
                    fields:
                      - { label: "Language / label", name: "label", widget: "string" }
                      - { label: "Download link", name: "url", widget: "string" }
          - label: "Tool cards"
            name: "toolList"
            widget: "object"
            fields:
              - label: "Tools"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Small label", name: "meta", widget: "string", required: false }
                  - { label: "Description", name: "description", widget: "text", required: false }
                  - { label: "Screenshot", name: "photo", widget: "object", collapsed: true, required: false, fields: *photoFields }
                  - { label: "Button label", name: "linkLabel", widget: "string", required: false }
                  - { label: "Opens page (address)", name: "target", widget: "string", required: false, hint: "A page on this site, e.g. mywell. Leave empty when using an external link." }
                  - { label: "External link", name: "url", widget: "string", required: false, hint: "Wins over the page address if both are set." }
          - label: "Partner list"
            name: "partnerList"
            widget: "object"
            fields:
              - label: "Partners"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Small label", name: "meta", widget: "string", required: false, hint: "e.g. Australia · Lead partner" }
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Website", name: "url", widget: "string", required: false }
          - label: "Portrait band"
            name: "portraitBand"
            widget: "object"
            fields:
              - label: "People"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Role", name: "title", widget: "string", required: false }
                  - { label: "Affiliation", name: "affiliation", widget: "string", required: false }
                  - { label: "Profile link", name: "url", widget: "string", required: false }
                  - { label: "Photo", name: "image", widget: "image" }
                  - { label: "Zoom (%)", name: "zoom", widget: "number", default: 100, value_type: "int", min: 50, max: 200, step: 5, required: false }
                  - { label: "Focus X (%)", name: "positionX", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
                  - { label: "Focus Y (%)", name: "positionY", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
                  - { label: "Fit", name: "fit", widget: "select", default: "auto", required: false, options: ["auto", "cover", "contain"] }
          - label: "Researchers"
            name: "portraitDirectory"
            summary: "Researchers ({{fields.items.length}})"
            fields:
              - { label: "Show the country + search filters", name: "filters", widget: "boolean", default: true, required: false }
              - label: "Researchers"
                name: "items"
                widget: "list"
                collapsed: true
                summary: "{{fields.name}} — {{fields.institute}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Page address", name: "slug", widget: "string", pattern: ['^[a-z0-9-]+$', "Lower-case letters, numbers and hyphens only"], hint: "Their page lives at /people/<address>/. Changing it breaks existing links." }
                  - { label: "Sort as", name: "sortName", widget: "string", required: false, hint: "Surname first, if the list should sort differently to the displayed name." }
                  - { label: "Role", name: "designation", widget: "string", required: false }
                  - { label: "Institution", name: "institute", widget: "string", hint: "Must match the wording other researchers there use, or the filter lists it twice." }
                  - { label: "Country", name: "country", widget: "select", options: ["Australia", "India"] }
                  - { label: "Highest qualification", name: "qualification", widget: "string", required: false }
                  - { label: "Areas of interest", name: "interests", widget: "text", required: false }
                  - { label: "Email", name: "email", widget: "string", required: false }
                  - { label: "Staff page", name: "homepage", widget: "string", required: false }
                  # Editors naturally copy a URL out of their own signed-in tab, which is
                  # a page only they can open — ORCID's /my-orcid dashboard, or a library
                  # ezproxy address. Both look right to the person who pasted them and
                  # send every public visitor to a sign-in screen.
                  - label: "Research profiles"
                    name: "profiles"
                    widget: "list"
                    required: false
                    hint: "Public links only. Open one in a private window first — if it asks you to sign in, it is the wrong URL."
                    field:
                      label: "URL"
                      name: "url"
                      widget: "string"
                      pattern: ['^https://(?!orcid\.org/my-orcid)(?![^/]*\.ezproxy\.)\S+$', "Must be a public https:// link. For ORCID use https://orcid.org/0000-0000-0000-0000, not the my-orcid dashboard. Library ezproxy links only work for that university."]
                  # Required, and it must stay required: scripts/verify.mjs fails the
                  # build on a researcher with no portrait, so one profile saved without
                  # one blocks every deploy — for the whole site, until someone notices.
                  # Its own field list rather than *photoFields, because a hero photo is
                  # allowed to be empty and a portrait is not.
                  - label: "Portrait"
                    name: "photo"
                    widget: "object"
                    hint: "Required — a researcher cannot be published without a portrait."
                    fields:
                      - { label: "Photo", name: "image", widget: "image" }
                      - { label: "Description for screen readers", name: "alt", widget: "string", required: false, hint: "Leave empty if the name printed beside it already says who this is." }
                      - { label: "Zoom (%)", name: "zoom", widget: "number", default: 100, value_type: "int", min: 50, max: 200, step: 5, required: false }
                      - { label: "Focus X (%)", name: "positionX", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
                      - { label: "Focus Y (%)", name: "positionY", widget: "number", default: 50, value_type: "int", min: 0, max: 100, step: 1, required: false }
                      - { label: "Fit", name: "fit", widget: "select", default: "auto", required: false, options: ["auto", "cover", "contain"] }
                  - { label: "Biography", name: "bio", widget: "list", required: false, field: { label: "Paragraph", name: "text", widget: "text" } }
                  - label: "Sections"
                    name: "sections"
                    widget: "list"
                    required: false
                    collapsed: true
                    summary: "{{fields.title}}"
                    hint: "e.g. Research Projects, Key Publications."
                    fields:
                      - { label: "Heading", name: "title", widget: "string" }
                      - { label: "Entries", name: "items", widget: "list", field: { label: "Entry", name: "text", widget: "text" } }
                  - { label: "Institution key", name: "instituteSlug", widget: "hidden", required: false }
                  - { label: "Original page", name: "source", widget: "hidden", required: false }

          - label: "Partner institutions"
            name: "partnerDirectory"
            summary: "Partner institutions ({{fields.items.length}})"
            fields:
              - { label: "Country", name: "country", widget: "select", required: false, options: [{ label: "All", value: "" }, "Australia", "India"], hint: "Leave as All to list every partner." }
              - label: "Layout"
                name: "layout"
                widget: "select"
                default: "grid"
                required: false
                options:
                  - { label: "Grid — a simple showcase", value: "grid" }
                  - { label: "Directory — search, country filters and collapsible groups", value: "directory" }
                hint: "Directory is for the partners page, where the reader is looking for an institution. Use Grid anywhere the block is showing off the partnership rather than being searched."
              - { label: "Show at most", name: "limit", widget: "number", value_type: "int", min: 0, required: false, hint: "Grid only. 0 or empty shows every institution. A smaller number keeps a showcase short — the partners page always lists them all regardless." }
              - label: "Partner institutions"
                name: "items"
                widget: "list"
                collapsed: true
                summary: "{{fields.country}} · {{fields.name}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Page address", name: "slug", widget: "string", pattern: ['^[a-z0-9-]+$', "Lower-case letters, numbers and hyphens only"], hint: "Their page lives at /partners/<address>/." }
                  - { label: "Country", name: "country", widget: "select", options: ["Australia", "India"] }
                  - { label: "Institution name used by researchers", name: "instituteName", widget: "string", required: false, hint: "Links this partner to the researchers listed under that institution." }
                  - { label: "Logo", name: "logo", widget: "object", fields: [{ label: "Image", name: "image", widget: "image" }] }
                  - { label: "One-line summary", name: "summary", widget: "text", required: false }
                  - { label: "Description", name: "body", widget: "list", required: false, field: { label: "Paragraph", name: "text", widget: "text" } }
                  - label: "Sections"
                    name: "sections"
                    widget: "list"
                    required: false
                    collapsed: true
                    summary: "{{fields.title}}"
                    fields:
                      - { label: "Heading", name: "title", widget: "string" }
                      - { label: "Entries", name: "items", widget: "list", field: { label: "Entry", name: "text", widget: "text" } }
                  - { label: "Original page", name: "source", widget: "hidden", required: false }

          - label: "Source note"
            name: "sourceNote"
            widget: "object"
            fields:
              - label: "Parts"
                name: "parts"
                widget: "list"
                hint: "Text pieces and links, joined in order into one small note."
                fields:
                  - { label: "Text", name: "text", widget: "string", required: false }
                  - { label: "Link", name: "link", widget: "object", collapsed: true, required: false, fields: [{ label: "Label", name: "label", widget: "string", required: false }, { label: "URL", name: "url", widget: "string", required: false }, { label: "Downloads a file", name: "download", widget: "boolean", default: false, required: false }, { label: "Opens in a new tab", name: "external", widget: "boolean", default: false, required: false }] }
              - { label: "style", name: "style", widget: "hidden", required: false }


  # Site-wide settings live in their own tiny files, so editing them can
  # never touch the deployment fields in site.json.
  - name: "site"
    label: "Site"
    files:
      - name: "brand"
        label: "Brand mark"
        file: "content/brand.json"
        fields:
          - label: "Icon shape"
            name: "shape"
            widget: "select"
            default: "drop"
            options:
              - { label: "Droplet", value: "drop" }
              - { label: "Circle", value: "circle" }
              - { label: "Squircle", value: "squircle" }
              - { label: "Pebble", value: "pebble" }
            hint: "The container around the confluence glyph — two streams meeting as one — shown in the rail, the mobile bar and the browser tab. Every shape keeps the same line work, so the mark stays on-design."
