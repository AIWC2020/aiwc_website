<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>AIWC — Content admin</title>
  </head>
  <body>
    <!-- Sveltia CMS. Deliberately NOT type="module": the bundle is a classic
         script, and marking it as a module stops it exposing window.CMS / window.h,
         which preview.js needs. -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <!-- Live preview: renders entries with the site's own renderer
         (/assets/templates.mjs), so it cannot drift from the real page. -->
    <script type="module" src="preview.js"></script>
  </body>
</html>
