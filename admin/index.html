<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <!-- The admin page holds a GitHub token in local storage, and both
         security advisories published against Sveltia CMS to date have been
         stored XSS. A strict policy is the cheapest defence available: even
         if injected markup executes, it cannot exfiltrate the token, because
         the only host it may talk to is GitHub's API.

         It also removes the CMS's optional third-party calls — a version
         check on unpkg, three fonts from jsdelivr, a status banner from
         githubstatus. All are wrapped in try/catch upstream, so blocking
         the version check and the banner costs nothing.

         The fonts were NOT free, which this comment previously got wrong.
         Material Symbols is a ligature font: the CMS's icon markup really
         does read <span>photo</span>, and the font is what turns it into a
         glyph. Blocked, every icon painted its own name — the Assets button
         that opens media upload read "photo", Contents read "article", and
         the Pages collection read "bookmark_manager". The CMS looked like it
         had no image upload at all. The three fonts are now served from this
         repository (see fonts.css), so the policy stays this strict and the
         icons still render. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      connect-src 'self' https://api.github.com;
      img-src 'self' data: blob: https://avatars.githubusercontent.com https://*.githubusercontent.com;
      media-src 'self' data: blob:;
      style-src 'self' 'unsafe-inline';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      font-src 'self' data:;
      frame-src 'self' blob: data:;
      base-uri 'self';
      form-action 'none';
      object-src 'none'">
    <title>AIWC — Content admin</title>
    <!-- The CMS's own fonts, re-pointed at local copies so they survive the
         policy above. Relative, so it follows the site's base path. -->
    <link rel="stylesheet" href="fonts.css" />
    <!-- Opens the CMS in its light theme. Must run before the bundle below,
         which reads the preference once at boot. Seeds only when unset, so
         the Theme setting keeps working. -->
    <script src="default-theme.js"></script>
  </head>
  <body>
    <!-- Sveltia CMS, vendored into this repository rather than loaded from a
         CDN, so the admin page depends on nothing outside GitHub. Pinned by
         filename: upgrading means dropping in a new file and changing this
         line, which makes the version visible in the diff.

         Deliberately NOT type="module": the bundle is a classic script, and
         marking it as a module stops it exposing window.CMS / window.h,
         which preview.js needs.

         The path is relative so it resolves whatever the site's base path is
         (/aiwc_website today, a domain root if a CNAME is added later). -->
    <script src="../assets/cms/sveltia-cms-0.177.1.js"></script>
    <!-- Live preview: renders entries with the site's own renderer
         (/assets/templates.mjs), so it cannot drift from the real page. -->
    <script type="module" src="preview.js"></script>
    <!-- "Edit as text" / "Restore & import" (admin/versions-button.js): a
         link to Page text & versions (admin/page-text.html) as a full page;
         on a page's edit screen it opens that page. Kept outside the CMS
         app so a CMS upgrade cannot break it. -->
    <script type="module" src="versions-button.js"></script>
    <style>
      /* Bottom-right, over the preview side: bottom-left sat on top of the
         form's field labels while editing. */
      .versions-button {
        position: fixed; right: 16px; bottom: 16px; z-index: 1000;
        padding: 7px 13px; border-radius: 999px; background: #0E6F66; color: #fff; text-decoration: none;
        font: 500 12px/1 system-ui, sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,.18); opacity: .9;
      }
      .versions-button:hover, .versions-button:focus-visible { background: #0B5A53; opacity: 1; }
    </style>
  </body>
</html>
